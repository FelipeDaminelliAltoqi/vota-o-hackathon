<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<title>Banca avaliadora · Hackathon AltoQi</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/base.css">
<style>
  #codigo{font-family:var(--display);font-weight:900;font-size:2rem;letter-spacing:.3em;text-transform:uppercase;text-align:center}
</style>
<script src="config.js"></script>
<script src="assets/comum.js"></script>
</head>
<body>
<div class="wrap">

  <section id="telaEntrada" class="entrada" hidden>
    <div class="topo"><img class="logo" src="assets/hackathon-wordmark.svg" alt="Hackathon AltoQi" width="120" height="30"></div>
    <div class="hero">
      <p class="eyebrow">Banca avaliadora</p>
      <h1 class="display">Acesso da banca</h1>
      <p>Digite o código individual que você recebeu da organização.</p>
    </div>
    <form id="formEntrada" novalidate>
      <div class="campo">
        <label for="codigo">Código de acesso</label>
        <input id="codigo" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      </div>
      <p class="erro-msg" id="erroEntrada" role="alert"></p>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
      <p class="nota">A banca pode revisar e alterar as notas enquanto a avaliação estiver aberta.</p>
    </form>
  </section>

  <section id="telaVoto" hidden>
    <div class="topo">
      <img class="logo" src="assets/hackathon-wordmark.svg" alt="Hackathon AltoQi" width="120" height="30">
      <div class="quem">Banca<b id="quemNome"></b><button type="button" class="link" id="sair">Sair</button></div>
    </div>
    <div class="hero">
      <p class="eyebrow" id="eyebrowVoto">Banca avaliadora</p>
      <h1 class="display">Avalie cada pitch nos 3 critérios</h1>
      <div class="legenda">
        <div><b>0</b><span id="rotMin"></span></div>
        <div class="max"><b>5</b><span id="rotMax"></span></div>
      </div>
    </div>
    <div class="progresso" aria-live="polite">
      <p><strong id="progTxt"></strong><span>Toque no pitch para avaliar</span></p>
      <div class="prog-trilho"><div class="prog-barra" id="progBarra"></div></div>
    </div>
    <div class="aviso erro" id="aviso" role="alert" hidden></div>
    <ol class="pitches" id="lista"></ol>
    <p class="rodape" id="rodape"></p>
    <div class="assinatura"><img src="assets/hackathon-wordmark.svg" alt="" width="96" height="24"></div>
  </section>
</div>

<script>
(function(){
  const { C, DEMO, CRIT, dois, fmt, media3, esc, mensagem, api, criarAvaliacao } = HQ;
  const $ = (id) => document.getElementById(id);
  const CHAVE = DEMO ? "hq-banca:demo" : "hq-banca:v2";
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>';
  const SETA = '<svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>';

  let codigo = (() => { try{ return localStorage.getItem(CHAVE) || ""; }catch(e){ return ""; } })();
  let membro = null, aberta = true, abertoId = null;
  const votos = {};   // id -> [i,c,t]
  const cards = {};   // id -> { el, aval, editando, enviando }

  $("rotMin").textContent = C.ROTULO_MIN; $("rotMax").textContent = C.ROTULO_MAX;
  if (DEMO){ $("eyebrowVoto").textContent = "Banca avaliadora (demonstração)"; $("codigo").placeholder = "DEMO01"; }

  function mostrarEntrada(msg){ $("telaVoto").hidden = true; $("telaEntrada").hidden = false; $("erroEntrada").textContent = msg || ""; $("codigo").value = ""; }
  $("formEntrada").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const cod = $("codigo").value.trim().toUpperCase();
    if (cod.length < 4){ $("erroEntrada").textContent = mensagem({ codigo:"codigo_invalido" }); return; }
    const b = $("btnEntrar"); b.disabled = true; b.textContent = "Entrando…";
    try{ await entrar(cod); }catch(e){ $("erroEntrada").textContent = mensagem(e); }
    finally{ b.disabled = false; b.textContent = "Entrar"; }
  });
  $("sair").addEventListener("click", () => { try{ localStorage.removeItem(CHAVE); }catch(e){} codigo = ""; mostrarEntrada(); });

  async function entrar(cod){
    const r = await api("banca_entrar", { p_codigo:cod });
    codigo = cod; try{ localStorage.setItem(CHAVE, cod); }catch(e){}
    membro = r; aberta = r.aberta !== false;
    Object.keys(votos).forEach(k => delete votos[k]);
    Object.entries(r.votos || {}).forEach(([k, v]) => votos[k] = v);
    montar();
  }

  function montar(){
    $("telaEntrada").hidden = true; $("telaVoto").hidden = false;
    $("quemNome").textContent = membro.nome;
    const lista = $("lista"); lista.innerHTML = "";
    C.PITCHES.forEach((p, idx) => {
      const li = document.createElement("li");
      li.className = "pitch"; li.dataset.id = p.id;
      li.innerHTML = `<button type="button" class="pitch-cab" aria-expanded="false" aria-controls="corpo-${p.id}">
          <span class="num">${dois(idx + 1)}</span><span><span class="titulo">${esc(p.titulo)}</span><span class="selo"></span></span>${SETA}</button>
        <div class="pitch-corpo" id="corpo-${p.id}" hidden><div class="aval"></div><div class="acao"></div></div>`;
      lista.appendChild(li);
      const card = { el:li, editando:false, enviando:false };
      card.aval = criarAvaliacao(li.querySelector(".aval"), { onChange:() => renderAcao(p.id) });
      if (votos[p.id]) card.aval.definir(votos[p.id]);
      cards[p.id] = card;
      li.querySelector(".pitch-cab").addEventListener("click", () => abrir(abertoId === p.id ? null : p.id, true));
      renderCard(p.id);
    });
    abrir(proximo(), false);
    if (!aberta) avisoEncerrada();
    atualizarProgresso();
  }
  const feito = (id) => !!votos[id];
  const proximo = (depoisDe) => {
    const ids = C.PITCHES.map(p => p.id), ini = depoisDe ? ids.indexOf(depoisDe) + 1 : 0;
    return [...ids.slice(ini), ...ids.slice(0, ini)].find(id => !feito(id)) ?? null;
  };
  function abrir(id, rolar){
    abertoId = id;
    C.PITCHES.forEach(p => {
      const c = cards[p.id], on = p.id === id;
      c.el.classList.toggle("aberto", on);
      c.el.querySelector(".pitch-cab").setAttribute("aria-expanded", String(on));
      c.el.querySelector(".pitch-corpo").hidden = !on;
    });
    if (id != null && rolar) requestAnimationFrame(() => cards[id].el.scrollIntoView({ behavior:"smooth", block:"start" }));
  }
  function renderCard(id){
    const c = cards[id], f = feito(id);
    c.el.classList.toggle("votado", f && !c.editando);
    c.el.querySelector(".selo").textContent = f ? `Avaliado · média ${fmt(media3(votos[id]))}` : "Avaliar 3 critérios";
    c.el.querySelector(".aval").hidden = f && !c.editando;
    renderAcao(id);
  }
  function renderAcao(id, animar){
    const c = cards[id], acao = c.el.querySelector(".acao");
    if (feito(id) && !c.editando){
      const v = votos[id];
      acao.innerHTML = `<div class="ok ${animar ? "anima" : ""}">${CHECK}Avaliação salva</div>
        <div class="resumo">${CRIT.map((k, i) => `<div>${esc(k.nome)}<b>${v[i]}</b></div>`).join("")}<div class="med">Média<b>${fmt(media3(v))}</b></div></div>
        ${aberta ? '<button class="btn sec" data-a="editar">Alterar notas</button>' : ""}`;
      const e = acao.querySelector('[data-a="editar"]');
      if (e) e.onclick = () => { c.editando = true; c.aval.definir(votos[id]); renderCard(id); };
      return;
    }
    if (!aberta){ c.aval.travar(true); acao.innerHTML = '<button class="btn" disabled>Avaliação encerrada</button>'; return; }
    c.aval.travar(c.enviando);
    const vals = c.aval.valores(), n = vals.filter(x => x != null).length;
    acao.innerHTML = (c.enviando ? '<button class="btn" disabled>Salvando…</button>'
      : n < 3 ? `<button class="btn" disabled>Avalie os 3 critérios (${n}/3)</button>`
      : `<button class="btn" data-a="salvar">Salvar avaliação · média ${fmt(media3(vals))}</button>`)
      + (c.editando ? '<button class="btn sec" data-a="cancelar">Cancelar alteração</button>' : "")
      + '<p class="status erro" role="alert"></p>';
    const s = acao.querySelector('[data-a="salvar"]'); if (s) s.onclick = () => salvar(id);
    const x = acao.querySelector('[data-a="cancelar"]'); if (x) x.onclick = () => { c.editando = false; c.aval.definir(votos[id]); renderCard(id); };
  }
  async function salvar(id){
    const c = cards[id], vals = c.aval.valores();
    c.enviando = true; renderAcao(id);
    try{ await api("votar_banca", { p_codigo:codigo, p_pitch:id, p_inovar:vals[0], p_conectar:vals[1], p_transformar:vals[2] }); }
    catch(e){
      c.enviando = false;
      if (e.codigo === "banca_encerrada"){ aberta = false; avisoEncerrada(); C.PITCHES.forEach(p => renderCard(p.id)); return; }
      if (e.codigo === "codigo_invalido"){ $("sair").click(); $("erroEntrada").textContent = mensagem(e); return; }
      renderAcao(id); c.el.querySelector(".status").textContent = mensagem(e); return;
    }
    const eraEdicao = c.editando;
    c.enviando = false; c.editando = false; votos[id] = vals;
    if (navigator.vibrate) navigator.vibrate([12, 40, 12]);
    renderCard(id); renderAcao(id, true); atualizarProgresso();
    if (!eraEdicao) setTimeout(() => { const prox = proximo(id); abrir(prox, prox != null); }, 900);
  }
  function atualizarProgresso(){
    const total = C.PITCHES.length, n = C.PITCHES.filter(p => feito(p.id)).length;
    $("progTxt").innerHTML = `<em>${dois(n)}</em>/${dois(total)} avaliados`;
    $("progBarra").style.width = (n / total * 100) + "%";
    const rod = $("rodape");
    if (n === total){ rod.textContent = "Todos os pitches avaliados. Obrigado!"; rod.className = "rodape fim"; }
    else { rod.textContent = "Suas notas ficam salvas e podem ser alteradas até o encerramento."; rod.className = "rodape"; }
  }
  function avisoEncerrada(){ const a = $("aviso"); a.textContent = "A avaliação da banca foi encerrada."; a.hidden = false; }

  // link direto do jurado: banca.html?c=CODIGO
  const doLink = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  if (doLink){ codigo = doLink; history.replaceState(null, "", location.pathname + (DEMO ? "?demo" : "")); }
  if (codigo) entrar(codigo).catch(e => mostrarEntrada(e.codigo === "codigo_invalido" ? mensagem(e) : ""));
  else mostrarEntrada();
})();
</script>
</body>
</html>
